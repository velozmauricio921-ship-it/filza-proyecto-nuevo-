name: Build IPA

on:
  workflow_dispatch:
    inputs:
      build:
        description: IPA variant to build
        required: true
        type: choice
        default: public
        options:
          - public
          - developer
          - both

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: filza27.2

      - name: Checkout a-Shell resources
        if: ${{ inputs.build == 'developer' || inputs.build == 'both' }}
        uses: actions/checkout@v4
        with:
          repository: holzschu/a-Shell
          path: a-shell-master
          sparse-checkout: Resources_mini

      - name: Install Theos and iOS SDK
        run: |
          brew install ldid
          git clone --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/"*.sdk "$RUNNER_TEMP/theos/sdks/"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"

      - name: Download base Filza IPA
        run: |
          BASE_IPA="$RUNNER_TEMP/FilzaSlop-v1.2.0-unsigned.ipa"
          echo "BASE_IPA=$BASE_IPA" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$BASE_IPA")"
          curl --fail --location --silent --show-error \
            "https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.2.0/FilzaSlop-v1.2.0-unsigned.ipa" \
            --output "$BASE_IPA"
          echo "e719ebb2b3babfb43c4d4e21904ec7c223f8e4ff5e634d4a2cbad9a5d103da27  $BASE_IPA" \
            | shasum --check --status

      - name: Build public IPA
        if: ${{ inputs.build == 'public' || inputs.build == 'both' }}
        working-directory: filza27.2
        env:
          WQ_APP_GROUPS: ${{ secrets.WQ_APP_GROUPS }}
        run: ./scripts/build_public.sh

      - name: Download a-Shell IPA
        if: ${{ inputs.build == 'developer' || inputs.build == 'both' }}
        env:
          ASHELL_IPA_URL: ${{ secrets.ASHELL_IPA_URL }}
        run: |
          test -n "$ASHELL_IPA_URL" || {
            echo "Configure the ASHELL_IPA_URL repository secret." >&2
            exit 1
          }
          curl --fail --location --silent --show-error \
            "$ASHELL_IPA_URL" \
            --output "$RUNNER_TEMP/Terminal.ipa"

      - name: Build developer IPA
        if: ${{ inputs.build == 'developer' || inputs.build == 'both' }}
        working-directory: filza27.2
        env:
          WQ_APP_GROUPS: ${{ secrets.WQ_APP_GROUPS }}
          ASHELL_IPA: ${{ runner.temp }}/Terminal.ipa
        run: ./scripts/build_developer.sh

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filza-ipa-${{ github.run_number }}
          path: filza27.2/build/*.ipa
          if-no-files-found: error
